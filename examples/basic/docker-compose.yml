# Minimal end-to-end example: litestream replicates a SQLite database to a
# local file replica (a stand-in for S3). Both the db and the replica live in
# named volumes so you can restart and watch the cold-start restore work.
services:
  litestream:
    image: ghcr.io/fabiocicerchia/sqlite-litestream
    environment:
      DB_PATH: /data/app.db
      REPLICA_URL: file:///replica
      # Optional client-side age encryption (uncomment + supply your own keys):
      # LITESTREAM_AGE_RECIPIENTS: age1...            # encrypt on replicate
      # LITESTREAM_AGE_IDENTITIES: AGE-SECRET-KEY-... # decrypt on restore
    volumes:
      - data:/data
      - replica:/replica
    # Bounded so the example is copy-pasteable into somewhere real. An
    # unbounded container is scheduled without guardrails and pushes nodes
    # towards over-provisioning.
    mem_limit: 128m
    cpus: 0.5

volumes:
  data:
  replica:
