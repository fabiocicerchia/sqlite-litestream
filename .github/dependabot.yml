version: 2
updates:
  # Keep GitHub Actions pinned SHAs fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # wait before proposing newly published versions
    groups:
      # Everything else rides in one pull request rather than one each.
      actions:
        patterns: ["*"]

  # Keep the Docker base images up to date.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
